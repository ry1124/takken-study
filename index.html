<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宅建">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>宅建 合格プラン</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== 今日 ===== -->
  <section id="view-today" class="view active">
    <header class="topbar">
      <h1>今日 <span id="app-version" class="app-version"></span></h1>
    </header>
    <div id="today-body" class="page"></div>
  </section>

  <!-- ===== テキスト(科目と章の一覧) ===== -->
  <section id="view-text" class="view">
    <header class="topbar"><h1>テキスト</h1></header>
    <div id="text-body" class="page"></div>
  </section>

  <!-- ===== 章を読む ===== -->
  <section id="view-chapter" class="view">
    <header class="topbar sub">
      <button id="btn-back-chapter" class="icon-btn">‹ 戻る</button>
      <span id="chapter-crumb" class="crumb"></span>
    </header>
    <article id="chapter-body" class="page reader"></article>
  </section>

  <!-- ===== 問題(出題のしかたを選ぶ) ===== -->
  <section id="view-quizmenu" class="view">
    <header class="topbar"><h1>問題</h1></header>
    <div id="quizmenu-body" class="page"></div>
  </section>

  <!-- ===== 問題を解く ===== -->
  <section id="view-quiz" class="view">
    <header class="topbar sub">
      <button id="btn-quit-quiz" class="icon-btn">‹ やめる</button>
      <span id="quiz-progress" class="crumb"></span>
    </header>
    <div id="quiz-body" class="page"></div>
  </section>

  <!-- ===== 計画(毎日の予定) ===== -->
  <section id="view-plan" class="view">
    <header class="topbar">
      <h1>計画</h1>
      <div class="topbar-actions">
        <button id="btn-plan-filter" class="icon-btn text-btn">未完了だけ</button>
        <button id="btn-plan-today" class="icon-btn text-btn">今日へ</button>
      </div>
    </header>
    <div id="plan-body" class="page flush"></div>
  </section>

  <!-- ===== 記録 ===== -->
  <section id="view-record" class="view">
    <header class="topbar"><h1>記録</h1></header>
    <div id="record-body" class="page"></div>
    <input id="backup-file" type="file" accept=".json,application/json" hidden>
  </section>

  <nav id="tabbar" class="tabbar">
    <button class="tab-btn active" data-tab="today"><span class="tab-icon">☀️</span><span>今日</span></button>
    <button class="tab-btn" data-tab="text"><span class="tab-icon">📖</span><span>テキスト</span></button>
    <button class="tab-btn" data-tab="quizmenu"><span class="tab-icon">✏️</span><span>問題</span></button>
    <button class="tab-btn" data-tab="plan"><span class="tab-icon">🗓️</span><span>計画</span></button>
    <button class="tab-btn" data-tab="record"><span class="tab-icon">📊</span><span>記録</span></button>
  </nav>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/version.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
